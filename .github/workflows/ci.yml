name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter, deliberately.
  #
  # A stacked pull request - one based on another branch rather than on `main` -
  # matched nothing here. Six of them sat for eighteen hours with no checks at
  # all: not failing, never run, which on the pull request page is indis-
  # tinguishable from having passed. 27,000 lines looked reviewed and were not.
  #
  # Nothing needed the filter. The deploy job and both Pages steps are each
  # already gated on `github.ref == 'refs/heads/main'`, so a pull request against
  # any base builds Storybook to prove it compiles and then throws it away.
  #
  # One limit to know: `pull_request` reads this file from the merge of head into
  # base, so a stacked pull request only gains checks once this change exists in
  # its base branch - in practice, as each becomes the bottom of the stack and
  # retargets to `main`. To check a branch before then, dispatch it by hand.
  pull_request:
  # Lets you redeploy the current `main` from the Actions tab without an empty
  # commit - the one thing the separate deploy workflow was still useful for.
  # Also the way to run these checks against any branch on demand, which is what
  # rescued the stack above.
  workflow_dispatch:

# `contents: read` is everything the checks need, and the default for every job
# here. The two jobs that publish raise their own permissions locally instead -
# `pages: write` and `id-token: write` are gone entirely, because the site is no
# longer an artifact deployment (see the deploy job).
permissions:
  contents: read

# Cancel superseded runs on a pull request branch, but never on `main`.
#
# On a pull request, cancelling is what you want: push three times while working
# and only the last run matters, so the first two are wasted minutes.
#
# On `main` it is actively harmful. Every push to `main` shares one group, so two
# merges close together mean the second cancels the first - and the first commit
# is left showing a red cross that reads as "this person's work failed CI" when
# it did nothing of the sort. That happened to the Badge merge: two merges three
# minutes apart, and the earlier one was killed at 3m23s.
#
# Nothing goes unverified either way, because history here is linear and the
# later commit contains the earlier one. But a commit on `main` should carry its
# own green tick, and `main` is only ever pushed to by a merge, so completing
# every run costs almost nothing.
concurrency:
  # Per COMMIT on `main`, per branch on a pull request.
  #
  # `cancel-in-progress: false` was already here and is not enough on its own:
  # it stops GitHub killing a RUNNING job, but a PENDING one is still dropped
  # the moment a third run joins the group. Three merges eight seconds apart
  # left three cancelled runs on `main` - measured, each ended within 24s of
  # starting, exactly as the next merge landed.
  #
  # Nothing went unverified that day, because each had passed its own pull
  # request check first. But a cancelled run wears a warning icon that is
  # indistinguishable from a real failure at a glance, and the day a merge does
  # break `main` is the day somebody scrolls past it.
  #
  # A group per commit cannot queue behind anything, so nothing supersedes it.
  # Pull requests keep the shared group deliberately: there, a newer push
  # SHOULD cancel the run for the code it replaced.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: 0

jobs:
  quality:
    # DO NOT RENAME. This exact string is the required status check on `main`
    # (branch protection matches the job name). Renaming it makes every pull
    # request wait forever for a check that no longer reports.
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reports design-token violations without failing the build.
      # There are known violations today (see TOKEN-REPORT.md); blocking on them
      # would stop every push. Switch to `npm run check:tokens:strict` and drop
      # continue-on-error once the count reaches zero.
      - name: Design token check (report only)
        run: npm run check:tokens
        continue-on-error: true

      # FAILS the build, and it has already earned its place. Two tokens reached a
      # pull request with their dark values typed straight into the block marked
      # DO NOT EDIT BY HAND. Everything was green - lint, types, 3,600 tests, the
      # colour gate - and the next person to run the generator would have deleted
      # both, putting a near-white hover inside a dark popover and bringing back
      # the invisible ink the token was added to fix. Nothing anywhere ran this
      # check, so nothing could have caught it.
      - name: The dark theme matches its map
        run: npm run check:theme

      # Unlike the token check above, this one FAILS the build. There are no
      # known violations to grandfather - every component is reachable today -
      # so blocking costs nothing, and the thing it catches is invisible
      # otherwise: the build succeeds and the import returns undefined.
      - name: Every component is importable
        run: npm run check:exports

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build library
        run: npm run build

      # AFTER the build, because it reads `dist/` - the package as a consumer
      # gets it, not the source we hope matches it.
      #
      # It exists because of a specific morning: five names a pull request had
      # carried were not kept when that pull request was folded in, 1.0.0
      # published without them, and the first anyone knew was every table with
      # More filters failing to load in the console. Lint, 3,600 tests and the
      # build were all green throughout.
      - name: The public API has not lost a name
        run: npm run check:api

      # Built ONCE, here, and the output is handed to the deploy job below.
      # This used to run twice - once to prove it compiles, and again in a
      # separate deploy workflow to publish it - which cost about two and a half
      # minutes on every merge for no benefit.
      - name: Build Storybook
        run: npm run build-storybook

      # WITHOUT THIS THE SITE LOSES EVERY STORY (2026-09-30).
      #
      # GitHub Pages runs a branch-served site through Jekyll unless the root
      # carries a `.nojekyll` file, and Jekyll does not copy Storybook's `assets/`
      # directory - which is where every story chunk lives. The shell loads, the
      # sidebar renders, and not one story opens. Nothing fails; the site is just
      # quietly hollow.
      #
      # It is written here, into the artifact, rather than in the deploy job, so
      # that BOTH publishes carry it: the site root and every pull request preview
      # deploy from this same build.
      - name: Keep Jekyll off the published site
        run: touch storybook-static/.nojekyll

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      # Handed to whichever job publishes it: `deploy` for a push to `main`,
      # `preview` for a pull request. A pull request used to build Storybook only
      # to prove it compiles and then throw it away; now the same build is the
      # preview, so the previews cost no extra build time.
      #
      # One day of retention: the only consumer is the job directly below.
      - name: Upload Storybook
        uses: actions/upload-artifact@v4
        with:
          name: storybook-${{ github.run_id }}
          path: storybook-static
          retention-days: 1
          # WITHOUT THIS THE `.nojekyll` ABOVE NEVER LEAVES THE BUILD JOB.
          # upload-artifact v4 skips dotfiles by default and says nothing about
          # it - no warning, no failure, just an artifact quietly missing the one
          # file the site cannot be published without. Measured: the step ran,
          # the log printed `include-hidden-files: false`, and the deployed
          # preview had no `.nojekyll`.
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    # `needs` is the point of this merge: the site cannot publish unless lint,
    # types, tests and both builds passed. Previously the deploy ran as its own
    # workflow in parallel with the checks, so a `main` that failed CI would
    # still have gone live.
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # WHY THIS IS NOT `actions/deploy-pages` ANY MORE (2026-09-30).
    #
    # GitHub Pages serves exactly ONE deployment per repository, and the artifact
    # flow replaces the whole site on every publish. That left nowhere to put a
    # per-pull-request preview: anything deployed beside the site would be wiped by
    # the next merge, and anything deployed instead of it would take the site down.
    #
    # So the site is a BRANCH now - `gh-pages` - with `main` at the root and each
    # open pull request under `pr-preview/pr-<number>/`. Same public URL. This is
    # the layout the console's design system already uses
    # (niravbhatt1317/motadata-design-system), and the two repositories are kept
    # the same on purpose.
    permissions:
      contents: write

    steps:
      # Required: the publish action runs git in the workspace, and fails to
      # initialise without a repository there.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Storybook
        uses: actions/download-artifact@v4
        with:
          name: storybook-${{ github.run_id }}
          path: storybook-static

      # `clean-exclude` IS THE WHOLE BALLGAME. Without it, publishing `main`
      # deletes everything else on the branch - including `pr-preview/` - so
      # merging ONE pull request would silently take down the previews of every
      # other open one, and the links in their comments would 404 with nothing to
      # explain why.
      #
      # The console's design system does not need this line because nothing
      # automated writes its site root; here, every merge does.
      - name: Publish to the site root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: storybook-static
          clean: true
          clean-exclude: |
            pr-preview/
          commit-message: 'Deploy Storybook from ${{ github.sha }}'

  preview:
    name: Preview this pull request
    needs: quality
    # Same-repo pull requests only. A fork's run gets a read-only token by design,
    # so it could not write `gh-pages` even if we asked it to - and a preview built
    # from untrusted code would be served from this site's own origin, sharing
    # storage with the real Storybook. A fork pull request still gets every check
    # above; it just gets no preview.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      # Required, same as the deploy job: the action runs git in the workspace.
      - name: Checkout
        uses: actions/checkout@v4

      # The build that already happened, rather than a second one. `main` used to
      # build Storybook twice for the same reason and it cost two and a half
      # minutes a merge (see the note on the Build Storybook step above), so the
      # preview reuses the artifact instead of repeating the build.
      - name: Download Storybook
        uses: actions/download-artifact@v4
        with:
          name: storybook-${{ github.run_id }}
          path: storybook-static

      # The same action the console's design system uses. It writes the preview,
      # updates it on each push and leaves ONE sticky comment with the link.
      #
      # `action: deploy` rather than the default `auto`: `auto` decides from the
      # event, and this job never sees a `closed` event - ci.yml does not trigger
      # on it, because running 3,600 tests to delete a directory is absurd. The
      # removal is preview-cleanup.yml.
      - name: Deploy the preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: storybook-static
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: deploy
